name: Publish Release Artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to publish artifact from'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: REFramework
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloaded files:"
          ls -laR
          # Unzip any archives if present
          for f in $(find . -name "*.zip"); do
            unzip -o "$f" -d unzipped/ || true
          done
          # Find dinput8.dll anywhere
          DLL_PATH=$(find . -name "dinput8.dll" | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "Error: Could not find dinput8.dll!"
            exit 1
          fi
          echo "Found dinput8.dll at: $DLL_PATH"
          if [ "$DLL_PATH" != "./dinput8.dll" ]; then
            cp "$DLL_PATH" ./dinput8.dll
          fi
          gh release delete v1.99.0-darwin -y --repo Ghostkwebb/REFramework-appleSilicon || true
          gh release create v1.99.0-darwin ./dinput8.dll --repo Ghostkwebb/REFramework-appleSilicon --title "Darwin Build Latest" --notes "Latest automated build"
